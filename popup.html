<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Timestamp Helper</title>
    <style>
      * {
        box-sizing: border-box;
        letter-spacing: 0;
      }

      body {
        width: 260px;
        margin: 0;
        padding: 14px;
        color: #172033;
        background: #f8fafc;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 13px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 16px;
        line-height: 1.2;
      }

      p {
        margin: 0 0 12px;
        color: #64748b;
        line-height: 1.55;
      }

      button {
        width: 100%;
        min-height: 38px;
        border: 1px solid #0f766e;
        border-radius: 6px;
        background: #0f766e;
        color: #ffffff;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <h1>Timestamp Helper</h1>
    <p>YouTubeの動画ページで右下にパネルが出ます。</p>
    <button id="openOptions" type="button">設定を開く</button>
    <script src="popup.js"></script>
  </body>
</html>
